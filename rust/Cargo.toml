[workspace]
resolver = "2"

members = [
    "crates/accounting_core",
    "crates/accounting_data",
    "crates/accounting_native",
    "crates/accounting_cli",
    "crates/accounting_zatca",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Basir Global Development Team"]
license = "Proprietary"
repository = "https://github.com/basir/basir_mvp"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Decimal arithmetic (financial precision) - CRITICAL
rust_decimal = { version = "1", features = ["serde"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# UUID generation
uuid = { version = "1", features = ["v4", "v5", "serde"] }

# Date/Time
chrono = { version = "0.4", features = ["serde"] }

# Cryptography (SHA-256 for hash chain)
sha2 = "0.11"
hex = "0.4"

# Error handling
thiserror = "2"
anyhow = "1"

# Environment
dotenvy = "0.15"

# Property-based testing
proptest = "1"

# FFI Bridge
flutter_rust_bridge = { version = "2.11.1", features = ["chrono", "uuid"] }

# Database
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "postgres",
    "uuid",
    "chrono",
    "rust_decimal",
    "json",
    "macros",
    "migrate",
] }
