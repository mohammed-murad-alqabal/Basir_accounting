plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// ===== إعدادات توقيع إصدار Basir Accounting =====
// لا يُستخدم توقيع debug مطلقاً لنسخة release. إن لم يوجد مفتاح إصدار،
// ينتج البناء غير موقّع ويجب على workflow الإنتاج رفض نشره.
def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def releaseKeystorePath = keystoreProperties['storeFile']
def releaseKeystoreFile = releaseKeystorePath ? project.file(releaseKeystorePath) : null

// اختبار وجود keystore حقيقي. يحل المسار النسبي من مجلد android/app،
// وهو المجلد الذي يكتب إليه مسار الإصدار في GitHub Actions.
boolean releaseSigningReady = keystorePropertiesFile.exists()
    && keystoreProperties['storePassword'] != null
    && keystoreProperties['storePassword'] != 'CHANGE_ME_STORE_PASSWORD'
    && keystoreProperties['keyPassword'] != null
    && keystoreProperties['keyPassword'] != 'CHANGE_ME_KEY_PASSWORD'
    && keystoreProperties['keyAlias'] != null
    && releaseKeystorePath != null
    && releaseKeystoreFile.isFile()

android {
    namespace = "com.basir.accounting"
    compileSdk = 37
    ndkVersion = flutter.ndkVersion

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.basir.accounting"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdkVersion = flutter.minSdkVersion
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    // ===== إعدادات توقيع الإصدار =====
    signingConfigs {
        if (releaseSigningReady) {
            release {
                storeFile = releaseKeystoreFile
                storePassword = keystoreProperties['storePassword']
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
                println "✅ [Basir] Using RELEASE signing with store: ${storeFile.getAbsolutePath()}"
            }
        } else {
            println "⚠️  [Basir] key.properties غير مكتمل أو مفتاح Keystore غير موجود."
            println "   ➜  لن تستخدم نسخة release توقيع debug؛ إعداد التوقيع الإنتاجي مطلوب قبل النشر."
        }
    }

    buildTypes {
        release {
            // عند غياب keystore تبقى نسخة release غير موقعة، ولا تُوقّع بمفتاح debug.
            if (releaseSigningReady) {
                signingConfig = signingConfigs.release
            }

            // ===== إعدادات الضغط والتجريد =====
            // تم ضبط قواعد ProGuard لحماية جميع فئات Pigeon والإضافات Flutter
            // مع التسجيل اليدوي عبر BasirPluginRegistrant (Kotlin) بدلاً من
            // GeneratedPluginRegistrant.java الذي تعطل بسبب file_picker 10.x (Kotlin-only).
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        // ===== نوع إصدار للاختبار على الأجهزة: بدون ضغط، مع توقيع Debug/Release حسب التوفر =====
        profile {
            initWith debug
            signingConfig = releaseSigningReady
                ? signingConfigs.release
                : signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    // إضافة androidx.window لحل مشكلة SidecarInterface
    implementation 'androidx.window:window:1.2.0'
    implementation 'androidx.window:window-java:1.2.0'
    
    // تثبيت إصدارات androidx.core لتجنب تعارض compileSdk
    constraints {
        implementation('androidx.core:core:1.13.1') {
            because 'previous versions require compileSdk 36'
        }
        implementation('androidx.core:core-ktx:1.13.1') {
            because 'previous versions require compileSdk 36'
        }
    }
}
