name: rust_lib_basir_app
description: A new Flutter project.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_rust_bridge: 2.11.1
  source_helper: ^1.3.4
  yaml: ^3.1.2

flutter:
  plugin:
    platforms:
      android:
        package: com.flutter_rust_bridge.rust_lib_basir_app
        pluginClass: RustLibBasirAppPlugin
      ios:
        pluginClass: RustLibBasirAppPlugin
      macos:
        pluginClass: RustLibBasirAppPlugin
      windows:
        pluginClass: RustLibBasirAppPlugin
      linux:
        pluginClass: RustLibBasirAppPlugin
