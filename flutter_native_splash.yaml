# تكوين شاشة البداية (Splash Screen)
# يستخدم مع flutter_native_splash package

flutter_native_splash:
  # اللون الأبيض النقي للخلفية ليتناسب مع الشعار بشكل انسيابي
  color: "#FFFFFF"

  # استخدام الشعار الجديد (Logo) المفرغ
  image: assets/icons/splash_logo.png

  # الإعدادات للوضع الداكن
  color_dark: "#1A1A1A"
  image_dark: assets/icons/splash_logo.png

  # Android 12+
  android: true
  android_12:
    image: assets/icons/splash_logo.png
    icon_background_color: "#FFFFFF"
    image_dark: assets/icons/splash_logo.png
    icon_background_color_dark: "#1A1A1A"

  # iOS
  ios: true

  # Web
  web: true
  web_image_mode: center

  # إعدادات إضافية
  android_gravity: center
  ios_content_mode: center
  fullscreen: true

  # معلومات إضافية
  info_plist_files:
    - "ios/Runner/Info.plist"
