name: basir_accounting_system
description: نظام بصير المحاسبي - نظام المحاسبة الذكي المتكامل (Basir Intelligent
  Accounting System)
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  archive: ^3.6.1
  barcode_widget: ^2.0.4
  basir_drift_storage:
    path: packages/basir_drift_storage
  bcrypt: ^1.2.0
  crypto: ^3.0.7
  cupertino_icons: ^1.0.8
  decimal: ^3.2.4
  device_info_plus: ^13.2.0
  dio: ^5.9.0
  drift: ^2.31.0
  excel: ^4.0.6
  extension_google_sign_in_as_googleapis_auth: ^3.0.0
  file_picker: ^12.2.0
  fl_chart: ^1.1.1
  flex_color_picker: ^4.0.0
  flutter:
    sdk: flutter
  flutter_contacts: ^2.4.1
  flutter_dotenv: ^6.0.1
  flutter_local_notifications: ^22.3.0
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_rust_bridge: ^2.13.0
  flutter_secure_storage: ^11.0.0
  flutter_svg: ^2.2.3
  freezed_annotation: ^2.2.0
  google_fonts: ^8.2.1
  google_mlkit_text_recognition: ^0.17.1
  google_sign_in: ^7.2.0
  googleapis: ^17.0.0
  googleapis_auth: ^2.0.0
  hijri: ^3.0.0
  http: ^1.6.0
  image_picker: ^1.1.2
  intl: ^0.20.2
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  json_annotation: ^4.9.0
  local_auth: ^3.0.2
  lottie: ^3.3.0
  material_design_icons_flutter: ^7.0.7296
  math_expressions: ^3.2.0
  package_info_plus: ^10.2.1
  path: ^1.9.1
  path_provider: ^2.1.5
  pdf: ^3.11.3
  permission_handler: ^13.0.2
  printing: ^5.14.2
  qr_flutter: ^4.1.0
  riverpod: ^2.6.1
  riverpod_annotation: ^2.3.5
  share_plus: ^13.3.0
  shared_preferences: ^2.5.4
  shimmer: ^4.0.0
  supabase_flutter: ^2.12.0
  timezone: ^0.11.1
  url_launcher: ^6.2.2
  uuid: ^4.0.0
  yaml: ^3.1.2
dev_dependencies:
  build_runner: ^2.4.9
  ffi: ^2.1.4
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.3.5
  flutter_test:
    sdk: flutter
  freezed: ^2.5.2
  integration_test:
    sdk: flutter
  isar_generator: ^3.1.0+1
  json_serializable: ^6.8.0
  mockito: '>=5.4.4 <5.5.1'
  mocktail: ^1.0.3
  riverpod_generator: ^2.4.0
flutter:
  uses-material-design: true
  generate: true
  assets:
  - .env
  - assets/fonts/
  - assets/icons/
  - assets/images/
  fonts:
  - family: Cairo
    fonts:
    - asset: assets/fonts/Cairo-Regular.ttf
      weight: 400
    - asset: assets/fonts/Cairo-Medium.ttf
      weight: 500
    - asset: assets/fonts/Cairo-SemiBold.ttf
      weight: 600
    - asset: assets/fonts/Cairo-Bold.ttf
      weight: 700
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/app_icon.png
  adaptive_icon_background: '#FFFFFF'
  adaptive_icon_foreground: assets/icons/app_icon_foreground.png
  remove_alpha_ios: true
flutter_native_splash:
  color: '#FFFFFF'
  image: assets/icons/splash_logo_transparent.png
  android_12:
    color: '#FFFFFF'
    image: assets/icons/splash_logo_transparent.png
    icon_background_color: '#FFFFFF'
