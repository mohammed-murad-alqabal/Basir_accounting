name: basir_accounting_system
description: "نظام بصير المحاسبي - نظام المحاسبة الذكي المتكامل (Basir Intelligent Accounting System)"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.5.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  # Dependencies (sorted alphabetically)
  archive: ^3.6.1
  barcode_widget: ^2.0.4
  bcrypt: ^1.2.0
  crypto: ^3.0.7
  cupertino_icons: ^1.0.8
  decimal: ^3.2.4
  drift: ^2.31.0
  device_info_plus: ^12.3.0
  dio: ^5.9.0
  excel: ^4.0.6
  extension_google_sign_in_as_googleapis_auth: ^3.0.0
  file_picker: ^10.3.8
  fl_chart: ^1.1.1
  flex_color_picker: ^3.7.2
  flutter:
    sdk: flutter
  flutter_contacts: ^1.1.9+2
  flutter_dotenv: ^5.2.1
  flutter_local_notifications: ^19.5.0
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_rust_bridge: 2.11.1
  flutter_secure_storage: ^10.0.0
  flutter_svg: ^2.2.3
  freezed_annotation: ^2.2.0
  google_fonts: ^7.0.2
  google_mlkit_text_recognition: ^0.15.0
  google_sign_in: ^7.2.0
  googleapis: ^15.0.0
  googleapis_auth: ^2.0.0
  hijri: ^3.0.0
  http: any
  image_picker: ^1.1.2
  intl: ^0.20.2
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  json_annotation: ^4.9.0
  lottie: ^3.3.0
  material_design_icons_flutter: ^7.0.7296
  math_expressions: ^3.1.0
  package_info_plus: ^9.0.0
  path: any
  path_provider: ^2.1.5
  pdf: ^3.11.3
  permission_handler: ^12.0.1
  printing: ^5.14.2
  qr_flutter: ^4.1.0
  riverpod: any
  riverpod_annotation: ^2.3.5
  share_plus: ^12.0.1
  shared_preferences: ^2.5.4
  shimmer: ^3.0.0
  supabase_flutter: ^2.12.0
  timezone: ^0.10.1
  url_launcher: ^6.2.2
  uuid: ^4.0.0
  yaml: ^3.1.2
dev_dependencies:
  # Dev Dependencies (sorted alphabetically)
  build_runner: ^2.4.9
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.3.5
  flutter_test:
    sdk: flutter
  freezed: ^2.5.2
  integration_test:
    sdk: flutter
  isar_generator: ^3.1.0+1
  json_serializable: ^6.8.0
  mockito: ">=5.4.4 <5.5.1"
  mocktail: ^1.0.3
  riverpod_generator: ^2.4.0
# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  generate: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - .env
    - assets/fonts/
    - assets/icons/
    - assets/images/

  # خطوط Cairo المحلية للعمل بدون إنترنت
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700

# تكوين flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/icons/splash_logo_transparent.png"
  android_12:
    color: "#FFFFFF"
    image: "assets/icons/splash_logo_transparent.png"
    icon_background_color: "#FFFFFF"
