# تكوين نظام الأتمتة الذكي للوكلاء
# المشروع: بصير MVP
# المؤلف: فريق وكلاء تطوير مشروع بصير
# التاريخ: 5 ديسمبر 2025

# ========================================
# إعدادات الوكلاء
# ========================================
agents:
  analysis:
    enabled: true
    interval: 300 # 5 دقائق
    on_commit: true
    on_push: true
    daily: "02:00"

  testing:
    enabled: true
    on_commit: true
    on_pr: true
    coverage_threshold: 70

  security:
    enabled: true
    on_pr: true
    weekly: "Sunday 03:00"
    scan_dependencies: true

  performance:
    enabled: true
    interval: 300 # 5 دقائق
    continuous: true

  development:
    enabled: true
    auto_format: true
    auto_fix: true

  documentation:
    enabled: true
    on_commit: true
    coverage_threshold: 95

  review:
    enabled: true
    on_pr: true
    auto_approve_minor: false

  management:
    enabled: true
    continuous: true
    report_interval: 3600 # ساعة

# ========================================
# إعدادات المراقبة
# ========================================
monitoring:
  interval: 60 # ثانية
  metrics_retention: 1000 # عدد القياسات
  history_retention: 7 # أيام

  # عتبات النظام
  thresholds:
    cpu_percent: 80.0
    memory_percent: 85.0
    disk_percent: 90.0
    load_average: 8.0
    project_size_mb: 500.0
    build_time_seconds: 120.0
    test_coverage: 70.0
    code_quality_score: 70

# ========================================
# إعدادات التنبيهات
# ========================================
alerts:
  enabled: true

  # القنوات
  channels:
    log: true
    file: true
    console: true
    email: false
    slack: false

  # القنوات حسب الخطورة
  severity_channels:
    critical:
      - log
      - file
      - console
    warning:
      - log
      - file
    info:
      - log

  # الاحتفاظ بالتنبيهات (أيام)
  retention:
    critical: 30
    warning: 14
    info: 7

# ========================================
# إعدادات الإصلاح الذاتي
# ========================================
auto_healing:
  enabled: true
  max_retries: 3
  retry_delay: 5 # ثواني
  auto_rollback: true
  notifications: true

  # الإجراءات المفعلة
  actions:
    high_cpu_usage: true
    high_memory_usage: true
    high_disk_usage: true
    build_failure: true
    dependency_issues: true
    test_failures: false # يتطلب تدخل يدوي
    low_test_coverage: false # يتطلب تدخل يدوي
    analyze_issues: true
    security_vulnerability: true
    large_project_size: true
    corrupted_cache: true

# ========================================
# إعدادات محرك القرارات
# ========================================
decision_engine:
  enabled: true

  # أنواع القرارات المفعلة
  decision_types:
    immediate: true
    scheduled: true
    strategic: true

  # الأولويات
  priorities:
    critical: 1
    high: 2
    medium: 3
    low: 4

# ========================================
# إعدادات لوحة التحكم
# ========================================
dashboard:
  enabled: true
  port: 8080
  host: "localhost"
  refresh_interval: 5 # ثواني

  # الميزات
  features:
    real_time_metrics: true
    agent_status: true
    alerts: true
    decisions: true
    healing_history: true
    performance_charts: true

# ========================================
# إعدادات السجلات
# ========================================
logging:
  level: "INFO" # DEBUG, INFO, WARNING, ERROR, CRITICAL
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

  # الملفات
  files:
    orchestrator: "logs/orchestrator.log"
    performance: "logs/performance.log"
    decisions: "logs/decisions.log"
    alerts: "logs/alerts/"
    healing: "logs/healing.log"

  # التناوب
  rotation:
    max_bytes: 10485760 # 10MB
    backup_count: 5

# ========================================
# إعدادات Git Hooks
# ========================================
git_hooks:
  enabled: true

  hooks:
    pre_commit:
      - analysis_agent
      - testing_agent

    pre_push:
      - security_agent
      - testing_agent

    post_commit:
      - documentation_agent

# ========================================
# إعدادات CI/CD
# ========================================
ci_cd:
  enabled: true
  platform: "github_actions"

  triggers:
    on_push: true
    on_pr: true
    on_schedule: true

  jobs:
    - analysis
    - testing
    - security
    - build

# ========================================
# إعدادات الإشعارات
# ========================================
notifications:
  enabled: true

  # البريد الإلكتروني
  email:
    enabled: false
    smtp_server: ""
    smtp_port: 587
    username: ""
    password: ""
    from_address: ""
    to_addresses: []

  # Slack
  slack:
    enabled: false
    webhook_url: ""
    channel: "#basser-alerts"

# ========================================
# إعدادات التحسين
# ========================================
optimization:
  auto_cleanup: true
  cleanup_schedule: "daily 02:00"

  targets:
    - build_folder
    - temp_files
    - logs
    - cache

  thresholds:
    disk_usage_trigger: 85 # %
    project_size_trigger: 500 # MB

# ========================================
# إعدادات الأمان
# ========================================
security:
  scan_on_commit: true
  scan_dependencies: true
  block_on_vulnerability: true

  tools:
    - flutter_analyze
    - dart_analyze
    - dependency_check

# ========================================
# إعدادات التقارير
# ========================================
reports:
  enabled: true

  schedules:
    daily: "23:00"
    weekly: "Sunday 23:00"
    monthly: "1st 23:00"

  formats:
    - markdown
    - json

  destinations:
    - file
    - dashboard

# ========================================
# إعدادات التعلم الآلي (مستقبلاً)
# ========================================
machine_learning:
  enabled: false
  model_path: "models/"

  features:
    predictive_alerts: false
    anomaly_detection: false
    performance_prediction: false
