# نظام Git الآلي - Kiro Strategic Workspace
# التاريخ: 3 ديسمبر 2025
# المؤلف: فريق وكلاء تطوير مشروع بصير

version: "1.0.0"
enabled: true

# ========================================
# إعدادات Git الأساسية
# ========================================
git:
  user:
    name: "Kiro Strategic Workspace"
    email: "kiro@basser-mvp.local"

  default_branch: "main"
  remote: "origin"

  # الفروع المحمية
  protected_branches:
    - "main"
    - "production"
    - "staging"

# ========================================
# استراتيجية الكوميتات
# ========================================
commit_strategy:
  # نوع الكوميت (Conventional Commits)
  type: "conventional"

  # الأنواع المسموحة
  allowed_types:
    - feat # ميزة جديدة
    - fix # إصلاح خطأ
    - docs # توثيق
    - style # تنسيق
    - refactor # إعادة هيكلة
    - test # اختبارات
    - chore # مهام صيانة
    - perf # تحسين أداء
    - ci # CI/CD
    - build # بناء

  # قالب رسالة الكوميت
  message_template: "{type}({scope}): {description}"

  # التحقق التلقائي
  auto_validation:
    enabled: true
    check_message_format: true
    check_file_size: true
    max_file_size: "10MB"
    check_secrets: true
    check_conflicts: true

# ========================================
# استراتيجية الدفع
# ========================================
push_strategy:
  # متى يتم الدفع
  auto_push:
    enabled: true
    conditions:
      - "all_tests_pass"
      - "no_conflicts"
      - "quality_gates_pass"
      - "security_scan_pass"

  # الدفع الذكي
  smart_push:
    enabled: true
    batch_commits: true # دمج الكوميتات المتشابهة
    max_batch_size: 5
    batch_timeout: "30m" # الدفع كل 30 دقيقة

  # الدفع الآمن
  safe_push:
    enabled: true
    create_backup: true
    verify_remote: true
    check_ci_status: true

# ========================================
# إدارة الفروع
# ========================================
branch_management:
  # استراتيجية الفروع
  strategy: "git-flow"

  # أنماط أسماء الفروع
  naming_patterns:
    feature: "feature/{issue-id}-{description}"
    bugfix: "fix/{issue-id}-{description}"
    hotfix: "hotfix/{version}-{description}"
    release: "release/{version}"

  # التنظيف التلقائي
  auto_cleanup:
    enabled: true
    delete_merged_branches: true
    keep_branches_days: 30
    exclude_patterns:
      - "main"
      - "develop"
      - "release/*"

# ========================================
# الخطافات (Hooks)
# ========================================
hooks:
  pre_commit:
    enabled: true
    checks:
      - name: "format_code"
        command: "dart format ."
        auto_fix: true

      - name: "lint_code"
        command: "flutter analyze"
        fail_on_error: true

      - name: "check_secrets"
        command: "gitleaks detect --no-git"
        fail_on_error: true

      - name: "check_file_size"
        max_size: "10MB"
        fail_on_error: true

  pre_push:
    enabled: true
    checks:
      - name: "run_tests"
        command: "flutter test"
        fail_on_error: true

      - name: "check_coverage"
        command: "flutter test --coverage"
        min_coverage: 70
        fail_on_error: true

      - name: "security_scan"
        command: "flutter pub audit"
        fail_on_error: true

  post_commit:
    enabled: true
    actions:
      - name: "update_changelog"
        command: "node scripts/update-changelog.js"

      - name: "notify_team"
        command: "node scripts/notify-commit.js"

  post_merge:
    enabled: true
    actions:
      - name: "update_dependencies"
        command: "flutter pub get"

      - name: "run_migrations"
        command: "dart run migrations"

      - name: "rebuild_generated"
        command: "flutter pub run build_runner build"

# ========================================
# التكامل المستمر
# ========================================
ci_integration:
  enabled: true

  # GitHub Actions
  github_actions:
    enabled: true
    workflow_file: ".github/workflows/ci.yml"
    trigger_on:
      - push
      - pull_request

    jobs:
      - analyze
      - test
      - build
      - deploy

  # بوابات الجودة
  quality_gates:
    - name: "test_coverage"
      threshold: 70
      blocking: true

    - name: "code_quality"
      threshold: 85
      blocking: true

    - name: "security_score"
      threshold: 90
      blocking: true

    - name: "performance"
      threshold: 80
      blocking: false

# ========================================
# الإشعارات
# ========================================
notifications:
  enabled: true

  channels:
    slack:
      enabled: false
      webhook_url: "${SLACK_WEBHOOK_URL}"
      events:
        - push
        - merge
        - release

    email:
      enabled: false
      recipients:
        - "team@basser-mvp.local"
      events:
        - failed_push
        - security_alert

    console:
      enabled: true
      verbose: true

# ========================================
# النسخ الاحتياطي
# ========================================
backup:
  enabled: true

  # النسخ الاحتياطي التلقائي
  auto_backup:
    enabled: true
    frequency: "daily"
    retention_days: 30
    location: ".kiro/backups/git"

  # النسخ الاحتياطي قبل العمليات الحرجة
  before_operations:
    - merge
    - rebase
    - reset
    - force_push

# ========================================
# الأمان
# ========================================
security:
  # فحص الأسرار
  secrets_detection:
    enabled: true
    tools:
      - gitleaks
      - truffleHog
    patterns:
      - "api[_-]?key"
      - "password"
      - "secret"
      - "token"
      - "private[_-]?key"

  # التوقيع
  signing:
    enabled: false
    gpg_key: "${GPG_KEY_ID}"
    sign_commits: true
    sign_tags: true

  # التحقق
  verification:
    verify_signatures: false
    require_signed_commits: false

# ========================================
# التحليلات
# ========================================
analytics:
  enabled: true

  # تتبع المقاييس
  metrics:
    - commit_frequency
    - commit_size
    - branch_lifetime
    - merge_time
    - conflict_rate
    - revert_rate

  # التقارير
  reports:
    enabled: true
    frequency: "weekly"
    output: ".kiro/analytics/reports/git"

# ========================================
# الأتمتة المتقدمة
# ========================================
advanced_automation:
  # الدفع الذكي بناءً على السياق
  context_aware_push:
    enabled: true
    rules:
      - condition: "working_hours"
        action: "push_immediately"

      - condition: "after_hours"
        action: "batch_and_push_morning"

      - condition: "critical_fix"
        action: "push_immediately"

      - condition: "documentation_only"
        action: "batch_with_others"

  # الدمج التلقائي
  auto_merge:
    enabled: false
    conditions:
      - "all_checks_pass"
      - "approved_by_reviewers"
      - "no_conflicts"
      - "branch_up_to_date"

  # إنشاء PR تلقائياً
  auto_pr:
    enabled: true
    from_branches:
      - "feature/*"
      - "fix/*"
    to_branch: "develop"
    template: ".github/pull_request_template.md"

# ========================================
# التكوين المخصص
# ========================================
custom:
  # قواعد مخصصة
  rules: []

  # سكريبتات مخصصة
  scripts:
    pre_commit: []
    post_commit: []
    pre_push: []
    post_push: []
