name: Setup verified Flutter
description: Install a pinned Flutter SDK from the official archive with SHA-256 verification.

runs:
  using: composite
  steps:
    - name: Install Flutter 3.35.5
      shell: bash
      run: |
        set -Eeuo pipefail

        readonly flutter_version='3.35.5'
        readonly archive="flutter_linux_${flutter_version}-stable.tar.xz"
        readonly archive_sha256='8eead69e5d84131fcfbb2cfd44164c00e9a04df725f24672ea234c6bd136353d'
        readonly archive_url="https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/${archive}"
        readonly install_root="${RUNNER_TEMP}/flutter-sdk"
        readonly archive_path="${RUNNER_TEMP}/${archive}"

        curl --fail --show-error --location --retry 3 --retry-all-errors \
          --proto '=https' --tlsv1.2 "${archive_url}" --output "${archive_path}"
        printf '%s  %s\n' "${archive_sha256}" "${archive_path}" | sha256sum --check --status

        rm -rf "${install_root}"
        mkdir -p "${install_root}"
        tar -xJf "${archive_path}" -C "${install_root}" --strip-components=1
        printf '%s\n' "${install_root}/bin" >> "${GITHUB_PATH}"
        "${install_root}/bin/flutter" --version
