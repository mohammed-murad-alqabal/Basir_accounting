# Dependabot Configuration
# تكوين Dependabot لتحديثات الأمان والإصدارات التلقائية


version: 2
updates:
  # Flutter/Dart dependencies
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Riyadh"
    open-pull-requests-limit: 5
    reviewers:
      - "mohammed-murad-alqabal"
    assignees:
      - "mohammed-murad-alqabal"
    labels:
      - "dependencies"
      - "automated"
      - "security"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    # تجميع التحديثات المتعددة في PR واحد
    groups:
      flutter-dependencies:
        patterns:
          - "flutter*"
          - "riverpod*"
          - "isar*"
      development-dependencies:
        patterns:
          - "mockito"
          - "build_runner"
          - "*_generator"
        update-types:
          - "minor"
          - "patch"
    # لا توجد قواعد تجاهل محددة حالياً؛ لذلك لا ندرج مفتاح ignore.

# Rust/Cargo workspace dependencies
  - package-ecosystem: "cargo"
    directory: "/rust"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:15"
      timezone: "Asia/Riyadh"
    open-pull-requests-limit: 3
    reviewers:
      - "mohammed-murad-alqabal"
    assignees:
      - "mohammed-murad-alqabal"
    labels:
      - "dependencies"
      - "rust"
      - "security"
      - "automated"
    commit-message:
      prefix: "chore(deps-rust)"
      include: "scope"
    groups:
      rust-patch-and-minor:
        patterns:
