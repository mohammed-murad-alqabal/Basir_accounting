# Dependabot Configuration
# تكوين Dependabot لتحديثات الأمان والإصدارات التلقائية

version: 2
updates:
  # Flutter/Dart dependencies
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Riyadh"
    open-pull-requests-limit: 5
    reviewers:
      - "mohammed-murad-alqabal"
    assignees:
      - "mohammed-murad-alqabal"
    labels:
      - "dependencies"
      - "automated"
      - "security"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    # تجميع التحديثات المتعددة في PR واحد
    groups:
      flutter-dependencies:
        patterns:
          - "flutter*"
          - "riverpod*"
          - "isar*"
      development-dependencies:
        patterns:
          - "mockito"
          - "build_runner"
          - "*_generator"
        update-types:
          - "minor"
          - "patch"
    # تجاهل بعض التحديثات إذا لزم الأمر
    ignore: []
      # لا توجد حزم مستثناة حاليًا؛ تُضاف الاستثناءات كعناصر مصفوفة عند الحاجة.

  # Rust/Cargo workspace dependencies
  - package-ecosystem: "cargo"
    directory: "/rust"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:15"
      timezone: "Asia/Riyadh"
    open-pull-requests-limit: 3
    reviewers:
      - "mohammed-murad-alqabal"
    assignees:
      - "mohammed-murad-alqabal"
    labels:
      - "dependencies"
      - "rust"
      - "security"
      - "automated"
    commit-message:
      prefix: "chore(deps-rust)"
      include: "scope"
    groups:
      rust-patch-and-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Riyadh"
    open-pull-requests-limit: 3
    reviewers:
      - "mohammed-murad-alqabal"
    assignees:
      - "mohammed-murad-alqabal"
    labels:
      - "dependencies"
      - "ci/cd"
      - "automated"
      - "security"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
    # تجميع تحديثات Actions
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
# ملاحظات:
# 1. يتم فحص التحديثات كل يوم اثنين الساعة 9 صباحاً (توقيت الرياض)، مع تأخير 15 دقيقة لـCargo.
# 2. يغطي الملف pub وCargo وGitHub Actions؛ لا تُدمج PRs الآلية دون اجتياز بوابة الجودة ومراجعة بشرية.
# 3. تُجمع تحديثات minor وpatch، أما تحديثات major فتظل منفصلة لمراجعة توافق صريحة.
# 4. جميع PRs تُعيّن تلقائياً للمراجعة وتُصنف لتسهيل متابعة المالكين.
# 5. يجب تفعيل Dependabot alerts وDependabot security updates من إعدادات أمان المستودع.

