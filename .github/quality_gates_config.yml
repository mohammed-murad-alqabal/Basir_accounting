documentation:
  min_coverage: 95
  min_quality_score: 90
  required_sections:
    - overview
    - installation
    - usage
    - api_reference

code_quality:
  max_errors: 0
  max_complexity: 10
  max_line_length: 80
  required_documentation: true
  naming_conventions: true

test_coverage:
  min_coverage: 70
  unit_tests: true
  integration_tests: true
  widget_tests: true

security:
  check_vulnerabilities: true
  dependency_check: true
  secret_scanning: true
  vulnerability_assessment: true
  secure_coding_practices: true

quality_gates:
  - name: documentation_gate
    threshold: 95
    blocking: true
  - name: code_quality_gate
    threshold: 90
    blocking: true
  - name: test_coverage_gate
    threshold: 70
    blocking: true
  - name: security_gate
    threshold: 95
    blocking: true
