name: Migration Parity Contract

on:
  pull_request:
    paths:
      - 'scripts/migration_parity_gate.py'
      - 'test/migration_parity_gate_test.py'
      - '.github/workflows/migration-parity-contract.yml'
  push:
    branches:
      - main
    paths:
      - 'scripts/migration_parity_gate.py'
      - 'test/migration_parity_gate_test.py'
      - '.github/workflows/migration-parity-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migration-parity-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Migration Parity / Gate Contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify gate source compiles
        run: python3 -m py_compile scripts/migration_parity_gate.py

      - name: Run gate unit tests
        run: python3 -m unittest discover -s test -p 'migration_parity_gate_test.py' -v

      - name: Verify fail-closed behavior
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          import tempfile
          from pathlib import Path

          root = Path.cwd()
          gate = root / 'scripts' / 'migration_parity_gate.py'
          payload = {
              'run_id': 'ci-fail-closed-fixture',
              'application_commit': 'fixture',
              'mapping_version': 'fixture-v1',
              'mode': 'full',
              'parity_coverage': 1.0,
              'financial_diff_count': 1,
              'trial_balance_delta_minor': 1,
              'debit_credit_imbalance_count': 0,
              'missing_records': 0,
              'extra_records': 0,
              'duplicate_source_ids': 0,
              'orphan_relations': 0,
              'cross_tenant_violations': 0,
              'inventory_quantity_delta_minor': 0,
              'inventory_value_delta_minor': 0,
              'hash_chain_mismatch': 0,
              'unresolved_commands': 0,
              'rollback_result': 'PASS',
              'restore_verification': 'PASS',
          }
          with tempfile.TemporaryDirectory() as directory:
              directory = Path(directory)
              summary = directory / 'summary.json'
              output = directory / 'output'
              summary.write_text(json.dumps(payload), encoding='utf-8')
              result = subprocess.run(
                  ['python3', str(gate), '--summary', str(summary), '--out', str(output), '--mode', 'full'],
                  text=True,
                  capture_output=True,
              )
              if result.returncode != 1:
                  raise SystemExit(f'expected fail-closed exit 1, got {result.returncode}')
              report = json.loads((output / 'parity_gate_result.json').read_text(encoding='utf-8'))
              if report['decision'] != 'BLOCKED':
                  raise SystemExit(f"expected BLOCKED, got {report['decision']}")
              if not any(item.startswith('financial_diff_count=') for item in report['blockers']):
                  raise SystemExit('financial diff was not reported as a blocker')
          PY
