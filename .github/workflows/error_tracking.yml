name: Error Tracking & Reporting

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # تشغيل يومياً في الساعة 2 صباحاً
    - cron: "0 2 * * *"
  workflow_dispatch:

# تتيح الصلاحيات للتقارير حيث تسمح سياسة المستودع؛ فشل النشر يبقى استشاريًا.
permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  analyze-and-report:
    name: تحليل الأخطاء وإنشاء التقارير
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter
        with:
          flutter-version: "3.35.5"
          channel: "stable"
          cache: false

      - name: Get dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run Flutter Analyze
        id: analyze
        continue-on-error: true
        run: |
          set +e
          flutter analyze --no-fatal-infos > analyze_output.txt 2>&1
          ANALYZE_EXIT_CODE=$?
          set -e
          echo "analyze_exit_code=$ANALYZE_EXIT_CODE" >> $GITHUB_OUTPUT

          # استخراج الإحصائيات بقيم أحادية السطر صالحة لمخرجات GitHub Actions.
          ISSUES_COUNT=$(grep -c "issue" analyze_output.txt || true)
          ERRORS_COUNT=$(grep -c "error •" analyze_output.txt || true)
          WARNINGS_COUNT=$(grep -c "warning •" analyze_output.txt || true)
          INFO_COUNT=$(grep -c "info •" analyze_output.txt || true)
          ISSUES_COUNT=${ISSUES_COUNT:-0}
          ERRORS_COUNT=${ERRORS_COUNT:-0}
          WARNINGS_COUNT=${WARNINGS_COUNT:-0}
          INFO_COUNT=${INFO_COUNT:-0}

          echo "issues_count=$ISSUES_COUNT" >> $GITHUB_OUTPUT
          echo "errors_count=$ERRORS_COUNT" >> $GITHUB_OUTPUT
          echo "warnings_count=$WARNINGS_COUNT" >> $GITHUB_OUTPUT
          echo "info_count=$INFO_COUNT" >> $GITHUB_OUTPUT

      - name: Run Tests
        id: test
        continue-on-error: true
        run: |
          # تستثنى اختبارات الأداء غير الحتمية من تقارير حالة طلب السحب.
          set +e
          flutter test --reporter expanded $(find test -name '*_test.dart' ! -path 'test/benchmark/*') > test_output.txt 2>&1
          TEST_EXIT_CODE=$?
          set -e
          echo "test_exit_code=$TEST_EXIT_CODE" >> $GITHUB_OUTPUT

          # يمثل التقرير نتيجة مجموعة الاختبارات بصورة حتمية بدل تحليل صيغة المخرجات.
          if [ "$TEST_EXIT_CODE" -eq 0 ]; then
            PASSED=1
            FAILED=0
          else
            PASSED=0
            FAILED=1
          fi
          SKIPPED=0

          echo "tests_passed=$PASSED" >> $GITHUB_OUTPUT
          echo "tests_failed=$FAILED" >> $GITHUB_OUTPUT
          echo "tests_skipped=$SKIPPED" >> $GITHUB_OUTPUT

      - name: Create Error Report
        run: |
          mkdir -p logs/reports

          cat > logs/reports/error_report_$(date +%Y-%m-%d).md << 'EOF'
          # تقرير الأخطاء التلقائي

          **التاريخ:** $(date '+%Y-%m-%d %H:%M:%S')  
          **Commit:** ${{ github.sha }}  
          **Branch:** ${{ github.ref_name }}

          ## 📊 إحصائيات Flutter Analyze

          | النوع | العدد |
          |:---|:---:|
          | **Errors** | ${{ steps.analyze.outputs.errors_count }} |
          | **Warnings** | ${{ steps.analyze.outputs.warnings_count }} |
          | **Info** | ${{ steps.analyze.outputs.info_count }} |
          | **الإجمالي** | ${{ steps.analyze.outputs.issues_count }} |

          ## 🧪 نتائج الاختبارات

          | الحالة | العدد |
          |:---|:---:|
          | **نجح** ✅ | ${{ steps.test.outputs.tests_passed }} |
          | **فشل** ❌ | ${{ steps.test.outputs.tests_failed }} |
          | **تخطي** ⏭️ | ${{ steps.test.outputs.tests_skipped }} |

          ## 📝 التفاصيل

          ### Flutter Analyze Output
          ```
          $(cat analyze_output.txt | head -50)
          ```

          ### Test Output
          ```
          $(cat test_output.txt | tail -30)
          ```
          EOF

      - name: Upload Error Report
        uses: actions/upload-artifact@5d5d22a31266ced268874388b861e4b58bb5c2f3
        with:
          name: error-report-${{ github.run_number }}
          path: logs/reports/
          retention-days: 30

      - name: Create Issue on Critical Errors
        # تظل نتيجة التحليل منشورة حتى إذا منعت سياسة المستودع إنشاء التذاكر.
        if: steps.analyze.outputs.errors_count > 0
        continue-on-error: true
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v7.0.1
        with:
          script: |
            const errorsCount = ${{ steps.analyze.outputs.errors_count }};
            const warningsCount = ${{ steps.analyze.outputs.warnings_count }};
            const testsFailedCount = ${{ steps.test.outputs.tests_failed }};

            if (errorsCount > 0 || testsFailedCount > 0) {
              const title = `🚨 أخطاء حرجة مكتشفة - ${new Date().toISOString().split('T')[0]}`;
              const body = `
              # تقرير الأخطاء التلقائي
              
              تم اكتشاف أخطاء حرجة في الكود.
              
              ## 📊 الإحصائيات
              
              - **Errors:** ${errorsCount}
              - **Warnings:** ${warningsCount}
              - **Tests Failed:** ${testsFailedCount}
              
              ## 🔗 الروابط
              
              - **Commit:** ${context.sha}
              - **Branch:** ${context.ref}
              - **Workflow Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}
              
              ## 📝 الإجراءات المطلوبة
              
              - [ ] مراجعة الأخطاء
              - [ ] إصلاح المشاكل الحرجة
              - [ ] تشغيل الاختبارات محلياً
              - [ ] التحقق من الإصلاحات
              
              ---
              *تم إنشاء هذا التقرير تلقائياً بواسطة GitHub Actions*
              `;
              
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['bug', 'automated', 'critical']
              });
            }

      - name: Comment on PR
        # يبقى تقرير الجودة مرئيًا في السجل إذا كانت التعليقات محظورة.
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v7.0.1
        with:
          script: |
            const errorsCount = ${{ steps.analyze.outputs.errors_count }};
            const warningsCount = ${{ steps.analyze.outputs.warnings_count }};
            const testsPassedCount = ${{ steps.test.outputs.tests_passed }};
            const testsFailedCount = ${{ steps.test.outputs.tests_failed }};

            const comment = `
            ## 📊 تقرير جودة الكود

            ### Flutter Analyze
            - ❌ Errors: ${errorsCount}
            - ⚠️ Warnings: ${warningsCount}
            - ℹ️ Info: ${{ steps.analyze.outputs.info_count }}

            ### الاختبارات
            - ✅ نجح: ${testsPassedCount}
            - ❌ فشل: ${testsFailedCount}
            - ⏭️ تخطي: ${{ steps.test.outputs.tests_skipped }}

            ${errorsCount > 0 ? '⚠️ **تحذير:** يوجد أخطاء حرجة يجب إصلاحها قبل الدمج!' : ''}
            ${testsFailedCount > 0 ? '⚠️ **تحذير:** يوجد اختبارات فاشلة!' : ''}
            ${errorsCount === 0 && testsFailedCount === 0 ? '✅ **ممتاز!** لا توجد أخطاء حرجة.' : ''}
            `;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment
            });
