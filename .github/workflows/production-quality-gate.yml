# Basir Accounting Intelligent System
# Production-quality gate maintained by the Basir Accounting Development Team.
# This workflow validates code and produces release candidates; it never publishes a release.

name: Basir Accounting Production Quality Gate

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      build_release_candidate:
        description: "Build signed Android release-candidate artifacts"
        required: true
        default: false
        type: boolean

# Default to the minimum token scope. Publishing is deliberately kept out of this workflow.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: basir-quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.9"
  FLUTTER_GIT_SHA: "6b182d2c7585eba26d4edce0f97630effd256c33" # Flutter 3.44.9
  JAVA_VERSION: "17"
  MIN_COVERAGE: "70"
  RUST_BACKTRACE: "1"
  CARGO_TERM_COLOR: always

jobs:
  flutter-quality:
    name: Flutter quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Install Flutter SDK from immutable revision
        run: |
          set -euo pipefail
          flutter_root="$RUNNER_TEMP/flutter-sdk"
          git clone --filter=blob:none --no-checkout https://github.com/flutter/flutter.git "$flutter_root"
          git -C "$flutter_root" checkout --detach "$FLUTTER_GIT_SHA"
          echo "$flutter_root/bin" >> "$GITHUB_PATH"

      - name: Display toolchain versions
        run: |
          set -euo pipefail
          flutter --version
          dart --version
          java --version

      - name: Restore Dart packages without changing locked dependencies
        run: |
          set -euo pipefail
          flutter pub get
          git diff --exit-code -- pubspec.lock

      - name: Verify generated sources are current
        run: |
          set -euo pipefail
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- . ':!build' ':!.dart_tool'

      - name: Verify Dart formatting
        run: |
          set -euo pipefail
          targets=(lib test)
          if [ -d integration_test ]; then
            targets+=(integration_test)
          fi
          dart format --set-exit-if-changed "${targets[@]}"

      - name: Run static analysis
        run: flutter analyze --fatal-infos

      - name: Run Flutter tests with coverage
        run: flutter test --coverage --reporter expanded

      - name: Enforce line coverage threshold
        run: |
          set -euo pipefail
          test -s coverage/lcov.info
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends lcov
          coverage="$(lcov --summary coverage/lcov.info 2>&1 | awk '/lines/{gsub(/%/, "", $2); print $2; exit}')"
          test -n "$coverage"
          echo "Measured line coverage: ${coverage}%"
          awk -v measured="$coverage" -v minimum="${MIN_COVERAGE}" 'BEGIN {
            if (measured + 0 < minimum + 0) {
              printf "Coverage %.2f%% is below required %.2f%%\n", measured, minimum
              exit 1
            }
          }'

      - name: Build an unsigned Android smoke artifact
        run: flutter build apk --debug

      - name: Upload Flutter coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flutter-coverage-${{ github.sha }}
          path: coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14

  rust-quality:
    name: Rust ledger engine quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Rust with required components
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry, git sources and target directory
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Display Rust toolchain versions
        working-directory: rust
        run: |
          set -euo pipefail
          rustc --version --verbose
          cargo --version

      - name: Fetch locked Rust dependencies
        working-directory: rust
        run: cargo fetch --locked

      - name: Verify Rust formatting
        working-directory: rust
        run: cargo fmt --all -- --check

      - name: Run Clippy with warnings treated as errors
        working-directory: rust
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run Rust unit and integration tests
        working-directory: rust
        run: cargo test --workspace --all-targets --all-features --locked

      - name: Run Rust documentation tests
        working-directory: rust
        run: cargo test --workspace --doc --all-features --locked

  secret-scan:
    name: Secret and credential scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout complete history for scanning
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Review dependency changes in pull requests
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0

      - name: Record non-PR dependency-review policy
        if: github.event_name != 'pull_request'
        run: |
          echo "Dependency Review evaluates pull requests only."
          echo "Dependabot alerts and Rust audit remain required repository controls."

  rust-dependency-audit:
    name: Rust dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install locked Cargo Audit tool
        run: cargo install cargo-audit --locked --version 0.21.2

      - name: Audit locked Rust dependency graph
        working-directory: rust
        run: cargo audit --deny warnings

  quality-gate:
    name: Required production quality gate
    runs-on: ubuntu-latest
    needs:
      - flutter-quality
      - rust-quality
      - secret-scan
      - dependency-review
      - rust-dependency-audit
    if: ${{ always() }}

    steps:
      - name: Fail unless every mandatory quality check passed
        env:
          FLUTTER_RESULT: ${{ needs.flutter-quality.result }}
          RUST_RESULT: ${{ needs.rust-quality.result }}
          SECRET_RESULT: ${{ needs.secret-scan.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
          RUST_AUDIT_RESULT: ${{ needs.rust-dependency-audit.result }}
        run: |
          set -euo pipefail
          printf '%s\n' \
            "flutter-quality=${FLUTTER_RESULT}" \
            "rust-quality=${RUST_RESULT}" \
            "secret-scan=${SECRET_RESULT}" \
            "dependency-review=${DEPENDENCY_REVIEW_RESULT}" \
            "rust-dependency-audit=${RUST_AUDIT_RESULT}"
          for result in \
            "$FLUTTER_RESULT" \
            "$RUST_RESULT" \
            "$SECRET_RESULT" \
            "$DEPENDENCY_REVIEW_RESULT" \
            "$RUST_AUDIT_RESULT"; do
            if [ "$result" != success ]; then
              echo "A mandatory production-quality check did not pass."
              exit 1
            fi
          done

  android-release-candidate:
    name: Signed Android release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: quality-gate
    if: >-
      github.ref_type == 'tag' ||
      (github.event_name == 'workflow_dispatch' && inputs.build_release_candidate)
    environment: production
    permissions:
      contents: read

    steps:
      - name: Checkout release candidate source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Install Flutter SDK from immutable revision
        run: |
          set -euo pipefail
          flutter_root="$RUNNER_TEMP/flutter-sdk"
          git clone --filter=blob:none --no-checkout https://github.com/flutter/flutter.git "$flutter_root"
          git -C "$flutter_root" checkout --detach "$FLUTTER_GIT_SHA"
          echo "$flutter_root/bin" >> "$GITHUB_PATH"

      - name: Restore Dart packages without changing locked dependencies
        run: |
          set -euo pipefail
          flutter pub get
          git diff --exit-code -- pubspec.lock

      - name: Enforce production signing prerequisites
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for secret_name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD; do
            if [ -z "${!secret_name}" ]; then
              echo "Missing required production signing secret: ${secret_name}"
              exit 1
            fi
          done
          if grep -Eq 'signingConfig[[:space:]]*=[[:space:]]*signingConfigs\.debug' android/app/build.gradle; then
            echo "Refusing production build: android/app/build.gradle still uses the debug signing configuration."
            exit 1
          fi

      - name: Materialize ephemeral Android keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Build signed Android artifacts
        run: |
          set -euo pipefail
          flutter build apk --release --dart-define=APP_ENV=production
          flutter build appbundle --release --dart-define=APP_ENV=production

      - name: Generate SHA-256 checksums
        run: |
          set -euo pipefail
          sha256sum \
            build/app/outputs/flutter-apk/app-release.apk \
            build/app/outputs/bundle/release/app-release.aab \
            > build/basir-release-checksums.sha256

      - name: Upload signed release candidate for approved distribution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: basir-android-release-${{ github.sha }}
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
            build/basir-release-checksums.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Remove ephemeral signing materials
        if: always()
        run: |
          rm -f android/app/upload-keystore.jks android/key.properties

# Repository administrators must additionally configure branch protection for main:
# require the "Required production quality gate" status check, require pull-request
# review, dismiss stale approvals, block force pushes, and restrict direct pushes.
# Protect the "production" environment with required reviewers and restrict access.
# Pin third-party action revisions to immutable commit SHAs before the production rollout.
