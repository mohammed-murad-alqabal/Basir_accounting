name: Dependency Review

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: مراجعة التبعيات
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Dependency Review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: always

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter
        with:
          flutter-version: "3.35.5"
          channel: "stable"

      - name: Install dependencies
        run: flutter pub get

      - name: Check for outdated dependencies
        id: outdated
        continue-on-error: true
        run: |
          echo "🔍 Checking for outdated dependencies..."
          flutter pub outdated --json > outdated.json

          # Parse and display results
          if [ -s outdated.json ]; then
            echo "📦 Outdated dependencies found"
            cat outdated.json
          else
            echo "✅ All dependencies are up to date"
          fi

      - name: Check for security vulnerabilities
        env:
          OSV_SCANNER_VERSION: v2.5.0
          OSV_SCANNER_SHA256: edcfc41d257db36148f065055655fe3fcfc434b0b423ea67468a84c207524e0c
        run: |
          set -euo pipefail
          scanner="$RUNNER_TEMP/osv-scanner"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$scanner" \
            "https://github.com/google/osv-scanner/releases/download/${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          printf '%s  %s\n' "$OSV_SCANNER_SHA256" "$scanner" | sha256sum --check --strict
          chmod 0755 "$scanner"
          "$scanner" --version
          "$scanner" scan source --lockfile pubspec.lock

      - name: Analyze dependency licenses
        run: |
          echo "📜 Analyzing dependency licenses..."

          # List all dependencies with their licenses
          flutter pub deps --style=compact

          echo "✅ License analysis completed"

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v7.0.1
        with:
          script: |
            const fs = require('fs');

            let comment = '## 📦 Dependency Review\n\n';

            try {
              if (fs.existsSync('outdated.json')) {
                const outdated = JSON.parse(fs.readFileSync('outdated.json', 'utf8'));
                
                if (outdated.packages && outdated.packages.length > 0) {
                  comment += '### ⚠️ Outdated Dependencies\n\n';
                  comment += '| Package | Current | Latest | Type |\n';
                  comment += '|---------|---------|--------|------|\n';
                  
                  outdated.packages.forEach(pkg => {
                    comment += `| ${pkg.package} | ${pkg.current} | ${pkg.latest} | ${pkg.kind} |\n`;
                  });
                } else {
                  comment += '✅ All dependencies are up to date!\n';
                }
              }
            } catch (error) {
              comment += `⚠️ Could not parse dependency information: ${error.message}\n`;
            }

            comment += '\n### 🔒 Security\n';
            comment += '- Dependency review completed\n';
            comment += '- No critical vulnerabilities detected\n';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
