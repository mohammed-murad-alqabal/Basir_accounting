name: Quality Gates

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation-quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
      - name: Install dependencies
        run: flutter pub get
      - name: Documentation Quality Check - Coverage
        run: dart lib/tools/documentation/cli/documentation_cli.dart analyze
      - name: Documentation Quality Check - Quality
        run: dart lib/tools/documentation/cli/documentation_cli.dart validate --strict

  code-quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
      - name: Install dependencies
        run: flutter pub get
      - name: Code Quality Check
        run: flutter analyze --fatal-infos

  test-quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
      - name: Install dependencies
        run: flutter pub get
      - name: Run Tests with Coverage
        run: flutter test --coverage
      - name: Check Test Coverage
        run: |
          COVERAGE=$(lcov --summary coverage/lcov.info | grep "lines" | awk '{print $2}' | sed 's/%//')
          if (( $(echo "$COVERAGE < 70" | bc -l) )); then
            echo "Test coverage $COVERAGE% is below threshold 70%"
            exit 1
          fi

  security-quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
      - name: Install dependencies
        run: flutter pub get
      - name: Security Analysis - Check Vulnerabilities
        run: flutter pub deps --json | dart analyze --fatal-warnings

  quality-gate-summary:
    runs-on: ubuntu-latest
    needs:
      [
        documentation-quality-gate,
        code-quality-gate,
        test-quality-gate,
        security-quality-gate,
      ]
    if: always()
    steps:
      - name: Quality Gates Summary
        run: |
          echo "## Quality Gates Summary"
          echo "Documentation: ${{ needs.documentation-quality-gate.result }}"
          echo "Code Quality: ${{ needs.code-quality-gate.result }}"
          echo "Test Coverage: ${{ needs.test-quality-gate.result }}"
          echo "Security: ${{ needs.security-quality-gate.result }}"
