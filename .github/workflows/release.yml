name: Release Management

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (e.g., 1.0.0)"
        required: true
      release_type:
        description: "Release type"
        required: true
        type: choice
        options:
          - major
          - minor
          - patch

jobs:
  create-release:
    name: إنشاء إصدار جديد
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: "stable"

      - name: Get dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Build App Bundle
        run: flutter build appbundle --release

      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/v}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          # استخراج التغييرات من CHANGELOG.md
          CHANGELOG=$(sed -n "/## \[${{ steps.version.outputs.version }}\]/,/## \[/p" CHANGELOG.md | sed '$d')
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.version }}
          body: |
            # 🎉 إصدار ${{ steps.version.outputs.version }}

            ${{ steps.changelog.outputs.changelog }}

            ## 📦 الملفات

            - **APK:** `app-release.apk`
            - **App Bundle:** `app-release.aab`

            ## 📊 الإحصائيات

            - **حجم APK:** $(du -h build/app/outputs/flutter-apk/app-release.apk | cut -f1)
            - **التاريخ:** $(date '+%Y-%m-%d %H:%M:%S')
            - **Commit:** ${{ github.sha }}

            ## 🔗 الروابط

            - [CHANGELOG](CHANGELOG.md)
            - [Documentation](Documentation/)
            - [Issues](../../issues)
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify team
        if: success()
        run: |
          echo "✅ تم إنشاء الإصدار ${{ steps.version.outputs.version }} بنجاح!"
          echo "📦 الملفات متوفرة في Releases"
