name: Release Management

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (e.g., 1.0.0)"
        required: true
      release_type:
        description: "Release type"
        required: true
        type: choice
        options:
          - major
          - minor
          - patch

permissions:
  contents: write
  pull-requests: read

jobs:
  create-release:
    name: إنشاء إصدار جديد
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter
        with:
          flutter-version: "3.44.9"
          channel: "stable"
          cache: false

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: "zulu"
          java-version: "21"
          cache: "gradle"

      - name: Configure production environment asset
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -Eeuo pipefail
          if [[ -z "$SUPABASE_URL" || -z "$SUPABASE_ANON_KEY" ]]; then
            echo "Production release requires SUPABASE_URL and SUPABASE_ANON_KEY environment secrets." >&2
            exit 1
          fi
          case "$SUPABASE_URL" in
            https://*) ;;
            *) echo "SUPABASE_URL must use HTTPS." >&2; exit 1 ;;
          esac
          umask 077
          printf '%s\n' \
            "SUPABASE_URL=$SUPABASE_URL" \
            "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" \
            'ENVIRONMENT=production' \
            'DEBUG_MODE=false' \
            'LOG_LEVEL=error' > .env

      - name: Get dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Validate release version matches pubspec
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -Eeuo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            release_version="$REQUESTED_VERSION"
          else
            release_version="${GITHUB_REF_NAME#v}"
          fi
          package_version="$(sed -n 's/^version: \([0-9][^+]*\)+.*/\1/p' pubspec.yaml)"
          if [[ ! "$release_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release version must use MAJOR.MINOR.PATCH: $release_version" >&2
            exit 1
          fi
          if [[ "$release_version" != "$package_version" ]]; then
            echo "Release version $release_version does not match pubspec.yaml version $package_version." >&2
            exit 1
          fi

      - name: Configure production Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -Eeuo pipefail
          for secret_name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD; do
            if [[ -z "${!secret_name}" ]]; then
              echo "Missing required production signing secret: $secret_name" >&2
              exit 1
            fi
          done
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
          keytool -list -keystore android/app/upload-keystore.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null

      - name: Build APK
        run: flutter build apk --release

      - name: Build App Bundle
        run: flutter build appbundle --release

      - name: Generate API Docs
        run: |
          dart doc .
          zip -r api-docs.zip doc/api

      - name: Upload API Docs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: api-docs
          path: api-docs.zip

      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/v}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          # استخراج التغييرات من CHANGELOG.md
          if [ -f CHANGELOG.md ]; then
            CHANGELOG=$(sed -n "/## \[${{ steps.version.outputs.version }}\]/,/## \[/p" CHANGELOG.md | sed '$d' || echo "No changelog entry found")
          else
            CHANGELOG="No CHANGELOG.md file found"
          fi

          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Calculate APK size
        id: apk_size
        run: |
          APK_SIZE=$(du -h build/app/outputs/flutter-apk/app-release.apk | cut -f1)
          echo "size=$APK_SIZE" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191 # v2.0.8
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.version }}
          body: |
            # 🎉 إصدار ${{ steps.version.outputs.version }}

            ${{ steps.changelog.outputs.changelog }}

            ## 📦 الملفات

            - **APK:** `app-release.apk`
            - **App Bundle:** `app-release.aab`

            ## 📊 الإحصائيات

            - **حجم APK:** ${{ steps.apk_size.outputs.size }}
            - **التاريخ:** $(date '+%Y-%m-%d %H:%M:%S')
            - **Commit:** ${{ github.sha }}

            ## 🔗 الروابط

            - [CHANGELOG](CHANGELOG.md)
            - [Documentation](docs/)
            - [Issues](../../issues)
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove ephemeral production configuration and signing materials
        if: always()
        run: rm -f .env android/key.properties android/app/upload-keystore.jks

      - name: Notify team
        if: success()
        run: |
          echo "✅ تم إنشاء الإصدار ${{ steps.version.outputs.version }} بنجاح!"
          echo "📦 الملفات متوفرة في Releases"
