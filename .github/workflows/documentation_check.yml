name: Documentation Check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  documentation-coverage:
    name: Check Documentation Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: "stable"

      - name: Install dependencies
        run: flutter pub get

      - name: Run documentation analysis
        id: analyze
        run: |
          echo "🔍 Running documentation analysis..."

          # Run the documentation CLI analyze command
          dart run lib/tools/documentation/cli/documentation_cli.dart analyze --verbose || EXIT_CODE=$?

          # Store exit code for later use
          echo "exit_code=${EXIT_CODE:-0}" >> $GITHUB_OUTPUT

          # Exit with the actual code
          exit ${EXIT_CODE:-0}

      - name: Validate documentation quality
        id: validate
        run: |
          echo "✅ Validating documentation quality..."

          # Run the documentation CLI validate command
          dart run lib/tools/documentation/cli/documentation_cli.dart validate --strict || EXIT_CODE=$?

          # Store exit code
          echo "exit_code=${EXIT_CODE:-0}" >> $GITHUB_OUTPUT

          # Exit with the actual code
          exit ${EXIT_CODE:-0}

      - name: Generate documentation report
        if: always()
        run: |
          echo "📋 Generating documentation report..."

          # Generate report in multiple formats
          dart run lib/tools/documentation/cli/documentation_cli.dart report --format markdown --output documentation_report
          dart run lib/tools/documentation/cli/documentation_cli.dart report --format json --output documentation_report
          dart run lib/tools/documentation/cli/documentation_cli.dart report --format html --output documentation_report

      - name: Check coverage threshold
        if: always()
        run: |
          THRESHOLD=95
          ANALYZE_EXIT=${{ steps.analyze.outputs.exit_code }}
          VALIDATE_EXIT=${{ steps.validate.outputs.exit_code }}

          echo "📊 Analysis Exit Code: $ANALYZE_EXIT"
          echo "📊 Validation Exit Code: $VALIDATE_EXIT"
          echo "🎯 Required Threshold: ${THRESHOLD}%"

          if [ "$ANALYZE_EXIT" -ne 0 ] || [ "$VALIDATE_EXIT" -ne 0 ]; then
            echo "❌ Documentation coverage is below ${THRESHOLD}% or quality is insufficient"
            echo "⚠️  Please add documentation to public APIs and improve quality"
            echo ""
            echo "📝 To fix this:"
            echo "  1. Run: dart run lib/tools/documentation/cli/documentation_cli.dart analyze"
            echo "  2. Run: dart run lib/tools/documentation/cli/documentation_cli.dart generate"
            echo "  3. Run: dart run lib/tools/documentation/cli/documentation_cli.dart validate"
            exit 1
          else
            echo "✅ Documentation coverage and quality meet requirements!"
          fi

      - name: Upload report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: documentation-report
          path: |
            .documentation/reports/
            documentation_report.*

      - name: Comment on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            // Read the markdown report if it exists
            let reportContent = '## 📊 Documentation Coverage Report\n\n';

            try {
              if (fs.existsSync('documentation_report.md')) {
                reportContent += fs.readFileSync('documentation_report.md', 'utf8');
              } else {
                reportContent += '⚠️ Report file not found. Check the workflow logs for details.';
              }
            } catch (error) {
              reportContent += `❌ Error reading report: ${error.message}`;
            }

            // Add status badges
            const analyzeExit = '${{ steps.analyze.outputs.exit_code }}';
            const validateExit = '${{ steps.validate.outputs.exit_code }}';

            reportContent += '\n\n### Status\n\n';
            reportContent += `- Analysis: ${analyzeExit === '0' ? '✅ Pass' : '❌ Fail'}\n`;
            reportContent += `- Validation: ${validateExit === '0' ? '✅ Pass' : '❌ Fail'}\n`;
            reportContent += `- Overall: ${analyzeExit === '0' && validateExit === '0' ? '✅ Pass' : '❌ Fail'}\n`;

            // Post comment
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: reportContent
            });

  dartdoc-generation:
    name: Generate DartDoc
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: "stable"

      - name: Install dependencies
        run: flutter pub get

      - name: Generate DartDoc
        run: |
          echo "📚 Generating DartDoc..."
          dart doc .

          if [ -d "doc/api" ]; then
            echo "✅ DartDoc generated successfully"
            ls -lh doc/api/
          else
            echo "❌ DartDoc generation failed"
            exit 1
          fi

      - name: Upload DartDoc
        uses: actions/upload-artifact@v4
        with:
          name: dartdoc
          path: doc/api/

  auto-generate-docs:
    name: Auto-Generate Missing Documentation
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: documentation-coverage
    # Only run if coverage check failed
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.head_ref }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: "stable"

      - name: Install dependencies
        run: flutter pub get

      - name: Generate missing documentation
        run: |
          echo "🔧 Generating missing documentation..."
          dart run lib/tools/documentation/cli/documentation_cli.dart generate --path lib/

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet; then
            echo "No documentation was generated"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "Documentation was generated"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git commit -m "docs: auto-generate missing documentation [skip ci]"
          git push

      - name: Comment on PR
        if: steps.check_changes.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🤖 **Auto-Documentation Bot**\n\nI\'ve automatically generated missing documentation for this PR. Please review the changes and run validation again.'
            });
