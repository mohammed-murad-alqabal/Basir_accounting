name: Documentation Check

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation-coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter
        with:
          flutter-version: "3.35.5"

      - name: Install dependencies
        run: flutter pub get

      - name: Run documentation analysis
        run: dart lib/tools/documentation/cli/documentation_cli.dart analyze

      - name: Validate documentation quality
        run: dart lib/tools/documentation/cli/documentation_cli.dart validate

      - name: Generate documentation report
        if: always()
        run: |
          dart lib/tools/documentation/cli/documentation_cli.dart report --format=json --output=doc-report.json
          dart lib/tools/documentation/cli/documentation_cli.dart report --format=markdown --output=doc-report.md

      - name: Check coverage threshold (advisory)
        if: always()
        id: coverage
        env:
          THRESHOLD: 80
        run: |
          set -euo pipefail
          test -s doc-report.json || { echo "Documentation JSON report is missing"; exit 1; }
          COVERAGE=$(node -e "const r=require('./doc-report.json'); console.log(r.coverage_percentage)")
          if node -e "const coverage=Number(process.argv[1]); const threshold=Number(process.argv[2]); process.exit(Number.isFinite(coverage) && coverage >= threshold ? 0 : 1)" "$COVERAGE" "$THRESHOLD"; then
            echo "meets_threshold=true" >> "$GITHUB_OUTPUT"
            echo "Documentation coverage $COVERAGE% meets threshold $THRESHOLD%"
          else
            echo "meets_threshold=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Documentation coverage $COVERAGE% is below advisory threshold $THRESHOLD%. Track remediation before making this gate blocking."
          fi
          echo "coverage=$COVERAGE" >> "$GITHUB_OUTPUT"

      - name: Upload report artifacts
        if: always()
        uses: actions/upload-artifact@5d5d22a31266ced268874388b861e4b58bb5c2f3
        with:
          name: documentation-report
          path: |
            doc-report.md
            doc-report.json
          if-no-files-found: warn

      - name: Comment on PR
        # A report artifact remains available when repository policy restricts
        # GITHUB_TOKEN comment writes; reporting must not mask validation success.
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false && always()
        continue-on-error: true
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- basir-documentation-coverage -->';
            let body;
            if (fs.existsSync('doc-report.json')) {
              const report = JSON.parse(fs.readFileSync('doc-report.json', 'utf8'));
              body = `${marker}
              ## Documentation Coverage Report

              | Metric | Actual result |
              | --- | ---: |
              | Coverage | ${Number(report.coverage_percentage).toFixed(1)}% |
              | Documented elements | ${report.documented_elements} / ${report.total_elements} |
              | Undocumented elements | ${report.undocumented_elements} |
              | Files below 70% | ${report.files_below_70_percent.length} |

              _Generated from this workflow's analysis artifact; it is not a static score._`;
            } else {
              body = `${marker}
              ## Documentation Coverage Report

              The report was not generated. Inspect the workflow logs before merging.`;
            }
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((comment) => comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
