name: Flutter CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Job 1: تحليل الكود والاختبارات
  analyze-and-test:
    name: تحليل واختبار
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Verify formatting
        run: dart format --set-exit-if-changed lib/ test/
      
      - name: Analyze code
        run: flutter analyze
      
      - name: Run tests
        run: flutter test --coverage
      
      - name: Check coverage
        run: |
          if [ -f coverage/lcov.info ]; then
            COVERAGE=$(lcov --summary coverage/lcov.info 2>&1 | grep lines | awk '{print $2}' | sed 's/%//')
            echo "Coverage: $COVERAGE%"
            if (( $(echo "$COVERAGE < 70" | bc -l) )); then
              echo "❌ Coverage is below 70%: $COVERAGE%"
              exit 1
            else
              echo "✅ Coverage is above 70%: $COVERAGE%"
            fi
          else
            echo "⚠️  No coverage file found"
          fi
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: coverage/lcov.info
          fail_ci_if_error: false

  # Job 2: بناء Android
  build-android:
    name: بناء Android
    runs-on: ubuntu-latest
    needs: analyze-and-test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '21'
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Build APK
        run: flutter build apk --release
      
      - name: Check APK size
        run: |
          SIZE_MB=$(du -m build/app/outputs/flutter-apk/app-release.apk | cut -f1)
          echo "APK Size: ${SIZE_MB}MB"
          if [ "$SIZE_MB" -gt 50 ]; then
            echo "⚠️  APK size is large (> 50 MB)"
          else
            echo "✅ APK size is acceptable (< 50 MB)"
          fi
      
      - name: Upload APK artifact
        uses: actions/upload-artifact@v3
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  # Job 3: بناء iOS (اختياري)
  build-ios:
    name: بناء iOS
    runs-on: macos-latest
    needs: analyze-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign
      
      - name: Upload iOS build
        uses: actions/upload-artifact@v3
        with:
          name: ios-build
          path: build/ios/iphoneos/

  # Job 4: فحص الأمان
  security-scan:
    name: فحص الأمان
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run security scan
        run: |
          echo "🔒 Running security scan..."
          
          # فحص الأسرار
          if grep -r -E "(password|secret|api_key|token)" lib/ --include="*.dart" | grep -v "// TODO\|// FIXME\|test"; then
            echo "❌ Found potential secrets in code"
            exit 1
          fi
          
          echo "✅ No secrets found"
      
      - name: Check dependencies for vulnerabilities
        run: |
          flutter pub outdated --json > outdated.json || true
          echo "📦 Dependencies checked"

  # Job 5: تقرير النتائج
  report:
    name: تقرير النتائج
    runs-on: ubuntu-latest
    needs: [analyze-and-test, build-android, security-scan]
    if: always()
    
    steps:
      - name: Generate report
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📊 CI/CD Report - بصير MVP"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "✅ Analysis: ${{ needs.analyze-and-test.result }}"
          echo "✅ Android Build: ${{ needs.build-android.result }}"
          echo "✅ Security Scan: ${{ needs.security-scan.result }}"
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
