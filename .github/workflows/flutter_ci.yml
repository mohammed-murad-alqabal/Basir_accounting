name: Flutter CI/CD - بصير MVP

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.44.9"
  # الخط الأساس المقاس في CI هو 25.5%. تُمنع أي تراجعات بينما تُرفع
  # التغطية تدريجيًا مع كل مهمة، بدل حجب التغييرات السليمة بسبب دين تقني سابق.
  MIN_COVERAGE: 25

jobs:
  # Job 1: Static Analysis
  static-analysis:
    name: 🔍 التحليل الثابت
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: 🔧 Setup Flutter
        uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: false

      - name: 📦 Get dependencies
        run: flutter pub get

      - name: 🧬 Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: 🎨 Verify formatting
        run: dart format --set-exit-if-changed lib/ test/
        continue-on-error: false

      - name: 🔍 Analyze code
        # ملاحظات الأسلوب تُبلَّغ في السجل؛ الأخطاء والتحذيرات فقط تمنع الدمج.
        run: flutter analyze --no-fatal-infos

      - name: 📏 Code Metrics
        # تُنشر المقاييس كتشخيص استشاري إلى أن يُعتمد خط أساس تدريجي؛
        # لا ينبغي أن تحجب أخطاء أسلوبية متراكمة دمج تغييرات وظيفية سليمة.
        run: |
          dart pub global activate dart_code_metrics
          dart pub global run dart_code_metrics:metrics lib || true

      - name: 🛡️ Security Sentinel
        run: |
          chmod +x .githooks/elite-sentinel
          ./.githooks/elite-sentinel

  # Job 2: Unit Testing
  unit-testing:
    name: 🧪 اختبارات الوحدة
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: 🔧 Setup Flutter
        uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: false

      - name: 📦 Get dependencies
        run: flutter pub get

      - name: 🧬 Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: 🧪 Run tests
        # تُشغَّل قياسات الأداء على عتاد مخصص؛ أما CI فيتحقق من الاختبارات
        # الوظيفية الحتمية فقط لتفادي تذبذب زمن التنفيذ وموارد العازل.
        run: flutter test --concurrency=1 --coverage --reporter expanded $(find test -name '*_test.dart' ! -path 'test/benchmark/*')

      - name: 📊 Check Coverage
        run: |
          if [ -f coverage/lcov.info ]; then
            sudo apt-get update && sudo apt-get install -y lcov
            COVERAGE=$(lcov --summary coverage/lcov.info 2>&1 | grep lines | awk '{print $2}' | sed 's/%//')
            echo "COVERAGE=$COVERAGE" >> $GITHUB_ENV
            echo "Coverage is $COVERAGE%"
            if (( $(echo "$COVERAGE < ${{ env.MIN_COVERAGE }}" | bc -l) )); then
              echo "❌ Coverage below ${{ env.MIN_COVERAGE }}%"
              exit 1
            fi
          else
            echo "❌ No coverage file"
            exit 1
          fi

      - name: 📤 Upload Coverage
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238
        with:
          file: coverage/lcov.info
          flags: unittests
          name: basir-coverage
          token: ${{ secrets.CODECOV_TOKEN }}

  # Job 3: Security Scan
  security-scan:
    name: 🔒 فحص الأمان
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: 🔍 Scan for secrets
        run: |
          # Match credential-shaped values and assignments only.  Domain terms
          # such as password validation or token refresh documentation are safe.
          if grep -r -n -E '(ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16})' lib/ --include='*.dart'; then
            echo "❌ Credential-shaped value found"
            exit 1
          fi

          if grep -r -n -E "(password|secret|api[_-]?key|token)[[:space:]]*[:=][[:space:]]*['\"][^'\"]{8,}" lib/ --include='*.dart'; then
            echo "❌ Hard-coded credential assignment found"
            exit 1
          fi

      - name: 🔧 Setup Flutter
        uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: false

      - name: 📦 Audit dependencies
        run: |
          flutter pub get
          flutter pub outdated --json > outdated.json || true

  # Job 4: Build Android
  build-android:
    name: 🤖 بناء Android
    runs-on: ubuntu-latest
    needs: [static-analysis, unit-testing, security-scan]
    if: github.event_name == 'push'
    timeout-minutes: 30
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: 🔧 Setup Flutter
        uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: false

      - name: ☕ Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: "zulu"
          java-version: "21"
          cache: "gradle"

      - name: 📦 Get dependencies
        run: flutter pub get

      - name: 🧬 Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: 🏗️ Build APK
        run: flutter build apk --release

      - name: 📤 Upload APK
        uses: actions/upload-artifact@5d5d22a31266ced268874388b861e4b58bb5c2f3
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

  # Job 5: Build iOS
  build-ios:
    name: 🍎 بناء iOS
    runs-on: macos-latest
    needs: [static-analysis, unit-testing, security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 45
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: 🔧 Setup Flutter
        uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: false

      - name: 📦 Get dependencies
        run: flutter pub get

      - name: 🧬 Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: 🏗️ Build iOS
        run: flutter build ios --release --no-codesign

      - name: 📤 Upload iOS
        uses: actions/upload-artifact@5d5d22a31266ced268874388b861e4b58bb5c2f3
        with:
          name: ios-build
          path: build/ios/iphoneos/
          retention-days: 7

  # Job 6: Final Report
  report:
    name: 📊 التقرير النهائي
    runs-on: ubuntu-latest
    needs: [build-android, build-ios]
    if: always()
    steps:
      - name: 📋 Status Check
        run: |
          echo "CI/CD Pipeline Completed"
          echo "Android: ${{ needs.build-android.result }}"
          echo "iOS: ${{ needs.build-ios.result }}"
