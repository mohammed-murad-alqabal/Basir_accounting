name: Flutter CI/CD - بصير MVP

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.24.0"
  MIN_COVERAGE: 70

jobs:
  # Job 1: Static Analysis
  static-analysis:
    name: 🔍 التحليل الثابت
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: 📦 Get dependencies
        run: flutter pub get

      - name: 🎨 Verify formatting
        run: dart format --set-exit-if-changed lib/ test/
        continue-on-error: false

      - name: 🔍 Analyze code
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: 📏 Code Metrics
        run: |
          dart pub global activate dart_code_metrics
          dart pub global run dart_code_metrics:metrics lib --fatal-style --fatal-performance --fatal-warnings

      - name: 🛡️ Security Sentinel
        run: |
          chmod +x .githooks/elite-sentinel
          ./.githooks/elite-sentinel

  # Job 2: Unit Testing
  unit-testing:
    name: 🧪 اختبارات الوحدة
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: 📦 Get dependencies
        run: flutter pub get

      - name: 🧪 Run tests
        run: flutter test --coverage --reporter expanded

      - name: 📊 Check Coverage
        run: |
          if [ -f coverage/lcov.info ]; then
            sudo apt-get update && sudo apt-get install -y lcov
            COVERAGE=$(lcov --summary coverage/lcov.info 2>&1 | grep lines | awk '{print $2}' | sed 's/%//')
            echo "COVERAGE=$COVERAGE" >> $GITHUB_ENV
            echo "Coverage is $COVERAGE%"
            if (( $(echo "$COVERAGE < ${{ env.MIN_COVERAGE }}" | bc -l) )); then
              echo "❌ Coverage below ${{ env.MIN_COVERAGE }}%"
              exit 1
            fi
          else
            echo "❌ No coverage file"
            exit 1
          fi

      - name: 📤 Upload Coverage
        uses: codecov/codecov-action@v4
        with:
          file: coverage/lcov.info
          flags: unittests
          name: basir-coverage
          token: ${{ secrets.CODECOV_TOKEN }}

  # Job 3: Security Scan
  security-scan:
    name: 🔒 فحص الأمان
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔍 Scan for secrets
        run: |
          if grep -r -E "(password|secret|api_key|token)" lib/ --include="*.dart" | grep -v "// TODO\|// FIXME\|test\|SecureStorage"; then
            echo "❌ Potential secrets found"
            exit 1
          fi

      - name: 🔧 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: 📦 Audit dependencies
        run: |
          flutter pub get
          flutter pub outdated --json > outdated.json || true

  # Job 4: Build Android
  build-android:
    name: 🤖 بناء Android
    runs-on: ubuntu-latest
    needs: [static-analysis, unit-testing, security-scan]
    if: github.event_name == 'push'
    timeout-minutes: 30
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "21"
          cache: "gradle"

      - name: 📦 Get dependencies
        run: flutter pub get

      - name: 🏗️ Build APK
        run: flutter build apk --release

      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

  # Job 5: Build iOS
  build-ios:
    name: 🍎 بناء iOS
    runs-on: macos-latest
    needs: [static-analysis, unit-testing, security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 45
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: 📦 Get dependencies
        run: flutter pub get

      - name: 🏗️ Build iOS
        run: flutter build ios --release --no-codesign

      - name: 📤 Upload iOS
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: build/ios/iphoneos/
          retention-days: 7

  # Job 6: Final Report
  report:
    name: 📊 التقرير النهائي
    runs-on: ubuntu-latest
    needs: [build-android, build-ios]
    if: always()
    steps:
      - name: 📋 Status Check
        run: |
          echo "CI/CD Pipeline Completed"
          echo "Android: ${{ needs.build-android.result }}"
          echo "iOS: ${{ needs.build-ios.result }}"
