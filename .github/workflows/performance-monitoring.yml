name: Performance Monitoring

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-size-analysis:
    name: تحليل حجم البناء
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: "stable"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --analyze-size

      - name: Analyze APK size
        id: size
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          SIZE_MB=$(du -m "$APK_PATH" | cut -f1)
          SIZE_KB=$(du -k "$APK_PATH" | cut -f1)

          echo "📦 APK Size: ${SIZE_MB}MB (${SIZE_KB}KB)"
          echo "size_mb=$SIZE_MB" >> $GITHUB_OUTPUT
          echo "size_kb=$SIZE_KB" >> $GITHUB_OUTPUT

          # Check against threshold (50MB)
          if [ "$SIZE_MB" -gt 50 ]; then
            echo "⚠️ APK size exceeds 50MB threshold"
            echo "status=warning" >> $GITHUB_OUTPUT
          else
            echo "✅ APK size is within acceptable range"
            echo "status=pass" >> $GITHUB_OUTPUT
          fi

      - name: Compare with base branch
        if: github.event_name == 'pull_request'
        run: |
          echo "📊 Comparing with base branch..."

          # Checkout base branch
          git fetch origin ${{ github.base_ref }}
          git checkout origin/${{ github.base_ref }}

          # Build base APK
          flutter pub get
          flutter build apk --release

          BASE_SIZE=$(du -k "build/app/outputs/flutter-apk/app-release.apk" | cut -f1)
          CURRENT_SIZE=${{ steps.size.outputs.size_kb }}

          DIFF=$((CURRENT_SIZE - BASE_SIZE))
          PERCENT=$(echo "scale=2; ($DIFF * 100) / $BASE_SIZE" | bc)

          echo "📊 Size comparison:"
          echo "  Base: ${BASE_SIZE}KB"
          echo "  Current: ${CURRENT_SIZE}KB"
          echo "  Difference: ${DIFF}KB (${PERCENT}%)"

          if [ $DIFF -gt 1024 ]; then
            echo "⚠️ APK size increased by more than 1MB"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const sizeMB = '${{ steps.size.outputs.size_mb }}';
            const sizeKB = '${{ steps.size.outputs.size_kb }}';
            const status = '${{ steps.size.outputs.status }}';

            const emoji = status === 'pass' ? '✅' : '⚠️';

            const body = `## ${emoji} Build Size Analysis

            | Metric | Value |
            |--------|-------|
            | **APK Size** | ${sizeMB}MB (${sizeKB}KB) |
            | **Status** | ${status === 'pass' ? '✅ Within limits' : '⚠️ Exceeds 50MB'} |
            | **Threshold** | 50MB |

            ${status === 'warning' ? '⚠️ **Warning:** APK size exceeds recommended threshold. Consider optimizing assets and dependencies.' : ''}
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  startup-performance:
    name: أداء بدء التشغيل
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: "stable"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze startup time
        run: |
          echo "⏱️ Analyzing startup performance..."

          # Run flutter analyze to check for performance issues
          flutter analyze --no-pub

          # Check for common performance anti-patterns
          echo "🔍 Checking for performance anti-patterns..."

          # Check for synchronous file I/O in main
          if grep -r "File.*readAsStringSync\|File.*writeAsStringSync" lib/main.dart; then
            echo "⚠️ Synchronous file I/O detected in main.dart"
            echo "Consider using async methods for better startup performance"
          fi

          # Check for heavy computations in build methods
          if grep -r "for.*in.*build\|while.*build" lib/ --include="*.dart" | grep -v "// Performance: OK"; then
            echo "⚠️ Potential heavy computation in build method"
            echo "Consider moving to initState or using compute()"
          fi

          echo "✅ Performance analysis completed"

  memory-analysis:
    name: تحليل الذاكرة
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: "stable"

      - name: Install dependencies
        run: flutter pub get

      - name: Check for memory leaks
        run: |
          echo "🧠 Checking for potential memory leaks..."

          # Check for missing dispose calls
          if grep -r "StreamController\|AnimationController\|TextEditingController" lib/ --include="*.dart" | \
             grep -v "dispose()" | grep -v "// Disposed by"; then
            echo "⚠️ Potential memory leak: Controller without dispose"
            echo "Ensure all controllers are properly disposed"
          fi

          # Check for listeners without removal
          if grep -r "addListener" lib/ --include="*.dart" | \
             grep -v "removeListener" | grep -v "// Listener removed"; then
            echo "⚠️ Potential memory leak: Listener without removal"
            echo "Ensure all listeners are properly removed"
          fi

          echo "✅ Memory analysis completed"

  code-complexity:
    name: تحليل تعقيد الكود
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: "stable"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code complexity
        run: |
          echo "📊 Analyzing code complexity..."

          # Count lines of code
          echo "📝 Lines of Code:"
          find lib -name "*.dart" | xargs wc -l | tail -1

          # Count number of files
          echo "📁 Number of Dart files:"
          find lib -name "*.dart" | wc -l

          # Check for large files (>500 lines)
          echo "📏 Large files (>500 lines):"
          find lib -name "*.dart" -exec wc -l {} \; | awk '$1 > 500 {print $2 " (" $1 " lines)"}' || echo "None"

          # Check for long methods (>50 lines)
          echo "🔍 Checking for long methods..."
          # This is a simplified check

          echo "✅ Complexity analysis completed"
